openapi: 3.0.0
info:
    title: Messenger API
    version: "1.0.0"
servers:
    - url: http://localhost:3000

paths:
    /web/users/registration-request:
        post:
            tags:
                - Auth
            summary: Register a new user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
            responses:
                "201":
                    description: User created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RegisterSuccessResponse"
                "400":
                    description: Validation or duplication error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/ValidationErrorResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                missingEmail:
                                    summary: Email is missing
                                    value:
                                        error:
                                            code: "VALIDATION_ERROR"
                                            message: "Validation failed"
                                            details:
                                                - field: "email"
                                                  message: '"email" is required'
                                                  type: "any.required"
                                duplicateAccount:
                                    summary: Account with this email already exists
                                    value:
                                        code: "USER_ALREADY_EXISTS"
                                        error: "An account with this email already exists. Try another email or login."
                                duplicateRegistrationRequest:
                                    summary: Reqest with this email already exists
                                    value:
                                        code: "USER_ALREADY_EXISTS"
                                        error: "Request already exists for this email"

    /web/users/login:
        post:
            tags:
                - Auth
            summary: Log in a user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Successful login
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LoginSuccessResponse"
                "401":
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                invalidCredentials:
                                    summary: Invalid login
                                    value:
                                        code: "INVALID_CREDENTIALS"
                                        error: "Invalid email or password"
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ValidationErrorResponse"

    /web/users/logout:
        get:
            tags:
                - Auth
            summary: Log out the current user
            responses:
                "200":
                    description: Successfully logged out
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LogoutSuccessResponse"
                "500":
                    description: Logout failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                logoutFailed:
                                    summary: Logout error
                                    value:
                                        code: "INTERNAL_SERVER_ERROR"
                                        error: "Logout failed"

components:
    schemas:
        RegisterRequest:
            type: object
            required:
                - username
                - email
                - password
            properties:
                username:
                    type: string
                    minLength: 3
                    example: johndoe
                email:
                    type: string
                    format: email
                    example: johndoe@example.com
                password:
                    type: string
                    minLength: 6
                    example: MyStrongPassword123
                role:
                    type: string
                    example: user

        RegisterSuccessResponse:
            type: object
            properties:
                message:
                    type: string
                    example: User registered successfully
                userId:
                    type: string
                    example: 64a2b95c4f6f0b2e7e4e2c91

        ValidationErrorDetail:
            type: object
            properties:
                field:
                    type: string
                    example: email
                message:
                    type: string
                    example: '"email" is required'
                type:
                    type: string
                    example: any.required

        ValidationErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        code:
                            type: string
                            example: VALIDATION_ERROR
                        message:
                            type: string
                            example: Validation failed
                        details:
                            type: array
                            items:
                                $ref: "#/components/schemas/ValidationErrorDetail"

        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                    example: User already exists
                code:
                    type: string
                    example: USER_ALREADY_EXISTS

        LoginRequest:
            type: object
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    example: johndoe@example.com
                password:
                    type: string
                    example: MyStrongPassword123

        LoginSuccessResponse:
            type: object
            properties:
                message:
                    type: string
                    example: Login successful
                user:
                    type: object
                    properties:
                        id:
                            type: string
                            example: 64a2b95c4f6f0b2e7e4e2c91
                        name:
                            type: string
                            example: John Doe
                        email:
                            type: string
                            example: johndoe@example.com

        LogoutSuccessResponse:
            type: object
            properties:
                message:
                    type: string
                    example: Logout
